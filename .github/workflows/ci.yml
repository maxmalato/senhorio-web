name: CI

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio: o CI só lê o repositório
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Ação de terceiro fixada pelo commit (v6.1.1)
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Instala o navegador do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      - name: Guarda o relatório do Playwright se falhar
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
